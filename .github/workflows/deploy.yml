name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to agent-bot.uz
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd ${{ secrets.PROJECT_PATH }}

            echo "▶ Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "▶ DIAG: docker network state before restart..."
            docker network ls || true
            docker network inspect call-center-agent-service_default --format 'subnet={{range .IPAM.Config}}{{.Subnet}}{{end}} attached={{range $id, $c := .Containers}}{{$c.Name}}={{$c.IPv4Address}} {{end}}' || true

            # Full down+up: container DNS broke after in-place network
            # recreation (stale endpoints); plain `up` does not reattach
            # running containers, so recreate everything atomically.
            echo "▶ Building and restarting containers (full recreate)..."
            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml up -d --build

            echo "▶ Waiting for API to be ready..."
            sleep 5

            echo "▶ DIAG: DNS check inside api container..."
            docker compose -f docker-compose.prod.yml exec -T api cat /etc/resolv.conf || true
            if ! docker compose -f docker-compose.prod.yml exec -T api getent hosts db; then
              echo "⚠️ Container DNS still broken — restarting docker daemon..."
              sudo -n systemctl restart docker || systemctl restart docker || service docker restart || true
              sleep 15
              docker compose -f docker-compose.prod.yml up -d
              sleep 5
              docker compose -f docker-compose.prod.yml exec -T api getent hosts db || echo "❌ DNS still broken after daemon restart"
            fi

            echo "▶ Running migrations..."
            docker compose -f docker-compose.prod.yml exec -T api alembic upgrade head

            echo "▶ Reloading nginx..."
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload

            echo "▶ Checking health..."
            sleep 3
            # api is not published on the host — check from inside the container
            docker compose -f docker-compose.prod.yml exec -T api curl -sf http://localhost:8001/health || echo "⚠️ Health check failed, check logs"

            echo "✅ Deploy complete!"
