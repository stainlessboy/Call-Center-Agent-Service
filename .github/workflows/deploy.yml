name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to agent-bot.uz
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd ${{ secrets.PROJECT_PATH }}

            echo "▶ Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "▶ Checking for stale pinned docker network..."
            # 172.28.0.0/16 was pinned once, clashed with the host network and
            # broke container DNS. `up` alone won't recreate the network after
            # the pin was removed from compose — force it with `down` once.
            SUBNET=$(docker network inspect call-center-agent-service_default --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}' 2>/dev/null || true)
            if [ "$SUBNET" = "172.28.0.0/16" ]; then
              echo "▶ Removing stale 172.28.0.0/16 network (broken DNS)..."
              docker compose -f docker-compose.prod.yml down
            fi

            echo "▶ Building and restarting containers..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "▶ Waiting for API to be ready..."
            sleep 5

            echo "▶ Running migrations..."
            docker compose -f docker-compose.prod.yml exec -T api alembic upgrade head

            echo "▶ Reloading nginx..."
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload

            echo "▶ Checking health..."
            sleep 3
            # api is not published on the host — check from inside the container
            docker compose -f docker-compose.prod.yml exec -T api curl -sf http://localhost:8001/health || echo "⚠️ Health check failed, check logs"

            echo "✅ Deploy complete!"
