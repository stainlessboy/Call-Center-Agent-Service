services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankbot}
      POSTGRES_DB: ${POSTGRES_DB:-bankbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankbot}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankbot}:${POSTGRES_PASSWORD:-bankbot}@db:5432/${POSTGRES_DB:-bankbot}
      # Trust X-Forwarded-* only from the compose network (nginx container).
      # Without this uvicorn ignores X-Forwarded-Proto and SQLAdmin renders
      # http:// asset URLs that browsers block on the https page.
      FORWARDED_ALLOW_IPS: 172.28.0.0/16
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8001"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot

volumes:
  pgdata:

networks:
  # Pinned subnet so FORWARDED_ALLOW_IPS above stays valid across recreates.
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
